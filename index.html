<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sundae Showdown | Spring Street Treats</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Graduate&family=Figtree:wght@400;500;600;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
/* Layout: Spring Street Treats' own look. Neon-green sign lettering, black storefront, pink and white from the logo and flyers. */
:root{
  --bg:#f6f7f6; --surface:#ffffff; --surface-2:#eef2ef; --line:#dde3de; --fg:#121412; --muted:#5b625c;
  --brand:#39d353; --brand-ink:#0b0d0b; --brand-text:#15802b; --brand-soft:#e3f8e6;
  --ink:#0d0f0d; --ink-fg:#ffffff; --ink-muted:#a8b0a9;
  --pink-text:#c22d76;
  --frat:#15802b; --frat-soft:#e3f6e6; --soro:#c22d76; --soro-soft:#fde6f1;
  --c-frat:#24a33a; --c-soro:#e0478f;
  --good:#1f8a4c; --good-soft:#e2f4e9; --warn:#b26a00; --warn-soft:#fdf1dc; --bad:#b3261e;
  --display:"Graduate", "Rockwell", Georgia, serif;
  --body:"Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --radius:12px;
  --shadow:0 1px 2px rgba(20,24,20,.06), 0 4px 14px rgba(20,24,20,.05);
  /* poster: a printed window card, same in both themes */
  --p-bg:#ffffff; --p-ink:#111311; --p-red:#24a33a; --p-blue:#15802b; --p-pink:#e0478f; --p-card:#ffffff; --p-line:#d6eedb; --p-neon:#39d353;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f110f; --surface:#171a17; --surface-2:#202420; --line:#2c322d; --fg:#eef2ee; --muted:#a3aca4;
  --brand:#3fe05c; --brand-ink:#0b0d0b; --brand-text:#5ff07a; --brand-soft:#15301b;
  --ink:#050605; --ink-fg:#ffffff; --ink-muted:#9aa39b; --pink-text:#f37bb4;
  --frat:#62e07a; --frat-soft:#163019; --soro:#f37bb4; --soro-soft:#3a1a2b;
  --c-frat:#2ea845; --c-soro:#e05a98;
  --good:#4cc47e; --good-soft:#173525; --warn:#f0a73a; --warn-soft:#3a2c14; --bad:#ff7b72;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0f110f; --surface:#171a17; --surface-2:#202420; --line:#2c322d; --fg:#eef2ee; --muted:#a3aca4;
  --brand:#3fe05c; --brand-ink:#0b0d0b; --brand-text:#5ff07a; --brand-soft:#15301b;
  --ink:#050605; --ink-fg:#ffffff; --ink-muted:#9aa39b; --pink-text:#f37bb4;
  --frat:#62e07a; --frat-soft:#163019; --soro:#f37bb4; --soro-soft:#3a1a2b;
  --c-frat:#2ea845; --c-soro:#e05a98;
  --good:#4cc47e; --good-soft:#173525; --warn:#f0a73a; --warn-soft:#3a2c14; --bad:#ff7b72;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25); color-scheme:dark;}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand-text)}
h1,h2,h3{text-wrap:balance;margin:0}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}

/* header */
.connbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:10px 14px;margin:0 0 16px;border:1px solid var(--good);background:var(--good-soft);border-radius:12px}
.conn-ok{display:inline-flex;align-items:center;gap:8px;color:var(--good)}.conn-ok b{color:var(--good)}
.conn-addr{font-weight:700}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ink);color:var(--ink-fg);border-bottom:3px solid var(--brand)}
.top-in{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 0;display:flex;flex-direction:column;gap:10px}
.brandrow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:36px;height:36px;border-radius:10px;background:var(--brand);display:grid;place-items:center;flex:none}
.brand b{font-family:var(--display);font-size:18px;letter-spacing:.02em;line-height:1.1;display:block;color:var(--brand)}
.brand small{color:var(--ink-muted);font-size:12px;display:block}
.who{font-size:12px;color:var(--ink-muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin:0 -4px}
.nav::-webkit-scrollbar{display:none}
.nav a{flex:none;padding:9px 12px 11px;color:var(--ink-muted);text-decoration:none;font-weight:600;font-size:14px;border-bottom:3px solid transparent;border-radius:0}
.nav a:hover{color:var(--ink-fg)}
.nav a[aria-current="page"]{color:var(--ink-fg);border-bottom-color:var(--brand)}

main{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 64px;display:flex;flex-direction:column;gap:20px}

/* building blocks */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;min-width:0}
.card h2{font-size:17px;font-weight:800}
.card h3{font-size:15px;font-weight:700}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.sec-head h1{font-family:var(--display);font-size:clamp(24px,4vw,34px);letter-spacing:.01em;line-height:1.1}
.sec-head p{margin:6px 0 0;color:var(--muted);max-width:68ch}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--pink-text)}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:860px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:14px;cursor:pointer;text-decoration:none;color:var(--fg);white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.small{padding:6px 10px;font-size:13px;border-radius:8px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.confirming{background:var(--bad);border-color:var(--bad);color:#fff}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.pill.frat{background:var(--frat-soft);color:var(--frat)}
.pill.sorority{background:var(--soro-soft);color:var(--soro)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.brand{background:var(--brand-soft);color:var(--brand-text)}
.pill.demo{background:var(--warn-soft);color:var(--warn)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:currentColor}
label.field{display:flex;flex-direction:column;gap:5px;font-weight:600;font-size:13px;min-width:0}
label.field span.hint{font-weight:400;color:var(--muted)}
input[type=text],input[type=email],input[type=tel],input[type=number],input[type=date],select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:9px 11px;font-size:14px;min-width:0}
textarea{resize:vertical;line-height:1.5}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand);outline-offset:-1px;border-color:transparent}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;padding:3px;background:var(--surface-2);gap:2px}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:7px;font-weight:700;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.tablewrap{overflow-x:auto;margin:0 -18px;padding:0 18px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.empty{border:1.5px dashed var(--line);border-radius:var(--radius);padding:28px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.banner{border-radius:10px;padding:10px 14px;font-size:14px;background:var(--warn-soft);color:var(--fg);border:1px solid var(--line)}
.banner b{color:var(--warn)}
.chip{display:inline-block;padding:3px 9px;border-radius:7px;background:var(--surface-2);font-size:12.5px;font-weight:600;margin:2px 4px 2px 0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:11px 16px;border-radius:10px;font-weight:600;font-size:14px;z-index:50;max-width:min(560px,calc(100vw - 32px));box-shadow:0 8px 30px rgba(0,0,0,.25)}

/* overview */
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px;align-items:center}
@media (max-width:860px){.hero{grid-template-columns:minmax(0,1fr)}}
.hero h1{font-family:var(--display);font-size:clamp(30px,5.4vw,52px);line-height:1.02;letter-spacing:.01em}
.hero p{font-size:16px;color:var(--muted);max-width:56ch;margin:12px 0 0}
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
@media (max-width:980px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.stat b{display:block;font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.15}
.stat span{font-size:12.5px;color:var(--muted);font-weight:600}
.timeline{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;counter-reset:step}
@media (max-width:860px){.timeline{grid-template-columns:minmax(0,1fr)}}
.tl{padding:12px 14px;border-top:3px solid var(--line);display:flex;flex-direction:column;gap:2px}
.tl.done{border-top-color:var(--good)}
.tl.now{border-top-color:var(--brand)}
.tl .when{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.tl b{font-size:14.5px}
.tl .st{font-size:12.5px;color:var(--muted)}
.mu{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.mu:last-child{border-bottom:0}
.mu .vs{font-family:var(--display);font-size:13px;color:var(--muted)}
.mu .b{text-align:right}
.team-name{font-weight:700}

/* outreach */
.org-row td:first-child{width:28px}
.org-name{font-weight:700}
.org-sub{font-size:12.5px;color:var(--muted)}
.preview{background:var(--surface-2);border-radius:10px;padding:14px;white-space:pre-wrap;font-size:14px;max-height:420px;overflow:auto}
.preview .subj{font-weight:800;margin-bottom:8px;display:block}
.mergefields{display:flex;flex-wrap:wrap;gap:6px}
.mergefields code{background:var(--surface-2);padding:2px 7px;border-radius:6px;font-size:12.5px}
.actionbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between;padding:12px 14px;border-radius:10px;background:var(--brand-soft)}

/* signup */
.form-shell{max-width:820px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:16px}
.form-hero{text-align:left}
.form-hero h1{font-family:var(--display);font-size:clamp(28px,5vw,44px);line-height:1.05}
.step{display:flex;flex-direction:column;gap:14px}
.step-h{display:flex;gap:10px;align-items:baseline}
.step-n{font-family:var(--display);color:var(--pink-text);font-size:18px}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:620px){.fields{grid-template-columns:minmax(0,1fr)}}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{position:relative}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt span{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border:1px solid var(--line);border-radius:999px;font-size:14px;font-weight:600;cursor:pointer;background:var(--surface);user-select:none}
.opt input:checked + span{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.opt input:focus-visible + span{outline:2px solid var(--brand);outline-offset:2px}
.opt input:disabled + span{opacity:.55;cursor:not-allowed;text-decoration:line-through}
.weekopts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:620px){.weekopts{grid-template-columns:minmax(0,1fr)}}
.weekopt span{display:flex;flex-direction:column;align-items:flex-start;border-radius:10px;padding:10px 12px;text-decoration:none!important;width:100%}
.weekopt small{font-weight:500;opacity:.8}
.weekopt{display:flex}
.builder{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:18px;align-items:start}
@media (max-width:720px){.builder{grid-template-columns:minmax(0,1fr)}}
.sundae-prev{background:var(--surface-2);border-radius:12px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:8px}
.sundae-prev .nm{font-weight:800;text-align:center}
.sketch-drop{border:1.5px dashed var(--line);border-radius:10px;padding:16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.sketch-drop img{width:96px;height:96px;object-fit:cover;border-radius:8px}
.confirm-card{text-align:center;padding:32px 18px}
.confirm-card h2{font-family:var(--display);font-size:28px}

/* signups */
.sub-card{display:grid;grid-template-columns:84px minmax(0,1fr);gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.sub-card:last-child{border-bottom:0}
.sub-art{width:84px;height:84px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;overflow:hidden}
.sub-art img{width:100%;height:100%;object-fit:cover}
.spotbar{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.spotbar i{display:block;height:100%}

/* matchups */
.sched td{vertical-align:top}
.sched .wk{white-space:nowrap}
.sched .wk b{display:block}
.mchip{display:flex;flex-direction:column;gap:2px;padding:9px 11px;border-radius:10px;margin-bottom:8px;border:1px solid var(--line);background:var(--surface)}
.mchip:last-child{margin-bottom:0}
.mchip .t{font-weight:700}
.mchip .why{font-size:12px;color:var(--muted)}
.mchip.frat{border-left:4px solid var(--frat)}
.mchip.sorority{border-left:4px solid var(--soro)}
tr.locked td{background:repeating-linear-gradient(135deg,var(--surface-2) 0 10px,var(--surface) 10px 20px);color:var(--muted)}
.possetup{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.possetup .item{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;background:var(--surface-2);padding:6px 8px;border-radius:6px;display:flex;justify-content:space-between;gap:8px;margin-top:6px}

/* scoreboard */
.result{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}
.result:last-child{border-bottom:0}
.rteam{display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr) auto;gap:10px;align-items:center}
@media (max-width:560px){.rteam{grid-template-columns:minmax(0,1fr) auto}.rteam .bar{grid-column:1/-1;order:3}}
.bar{height:10px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px}
.win{color:var(--good);font-weight:800}
.payline{font-size:13.5px;background:var(--good-soft);border-radius:8px;padding:7px 10px}
.upl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lb td .rank{font-family:var(--display);font-size:15px;color:var(--muted)}
.lb tr.fin td{background:var(--good-soft)}
.finale{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:16px;align-items:stretch}
@media (max-width:760px){.finale{grid-template-columns:minmax(0,1fr)}}
.finale .side{border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.finale .side.frat{background:var(--frat-soft)}
.finale .side.sorority{background:var(--soro-soft)}
.finale .vsbig{font-family:var(--display);font-size:28px;align-self:center;color:var(--muted)}
.finalist{display:flex;gap:10px;align-items:center;background:var(--surface);border-radius:10px;padding:8px 10px}
.finalist .art{width:44px;height:44px;flex:none}
.sidetotal{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}

/* menu board poster */
.poster-wrap{overflow-x:auto;margin:0 -18px;padding:0 18px}
.poster{width:880px;max-width:none;background:var(--p-bg);color:var(--p-ink);border-radius:14px;padding:34px;font-family:var(--body);border:6px solid var(--p-ink);box-shadow:inset 0 0 0 4px var(--p-neon);display:flex;flex-direction:column;gap:22px}
.poster .ph{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;border-bottom:3px dashed var(--p-line);padding-bottom:16px}
.poster .ph .k{font-size:13px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--p-red)}
.poster .ph h2{font-family:var(--display);font-size:52px;line-height:.95;color:var(--p-ink)}
.poster .ph .wk{font-family:var(--display);font-size:20px;text-align:right;color:var(--p-red)}
.poster .side-h{font-family:var(--display);font-size:20px;letter-spacing:.04em}
.poster .side-h.frat{color:var(--p-blue)}
.poster .side-h.sorority{color:var(--p-pink)}
.poster .pm{display:grid;grid-template-columns:1fr 54px 1fr;gap:12px;align-items:stretch}
.poster .pm.three{grid-template-columns:repeat(3,1fr)}
.poster .vs{font-family:var(--display);font-size:24px;color:var(--p-pink);display:grid;place-items:center}
.poster .pc{background:var(--p-card);border:2px solid var(--p-line);border-radius:14px;padding:14px;display:grid;grid-template-columns:120px 1fr;gap:12px;align-items:center}
.poster .pm.three .pc{grid-template-columns:1fr;text-align:center;justify-items:center}
.poster .pc .img{width:120px;height:120px;border-radius:10px;overflow:hidden;background:#fdeef5;display:grid;place-items:center}
.poster .pc .img img{width:100%;height:100%;object-fit:cover}
.poster .pc .ch{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.poster .pc .ch.frat{color:var(--p-blue)}
.poster .pc .ch.sorority{color:var(--p-pink)}
.poster .pc .sn{font-family:var(--display);font-size:22px;line-height:1.05;color:var(--p-ink)}
.poster .pc .ds{font-size:13px;color:#4a514b;margin-top:4px}
.poster .pfoot{display:flex;justify-content:space-between;gap:12px;align-items:center;background:var(--p-ink);color:#fff;border-radius:10px;padding:12px 16px;font-weight:700}
.poster .pfoot .price{font-family:var(--display);font-size:24px;color:var(--p-neon)}
.poster .lastwk{font-size:13px;color:#4a514b}


.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);font-weight:600}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.tip{position:fixed;z-index:60;pointer-events:none;background:var(--fg);color:var(--bg);font-size:12.5px;font-weight:600;padding:6px 9px;border-radius:7px;max-width:260px;box-shadow:0 6px 20px rgba(0,0,0,.2)}
[data-tip]{cursor:default}
.sidecompare{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.sidecompare .stat span:first-child{display:inline-flex;align-items:center;gap:6px}
.split{display:flex;gap:2px;height:16px;border-radius:6px;overflow:hidden}
.split i{display:block;height:100%}
.hbars{display:flex;flex-direction:column;gap:6px}
.hb{display:grid;grid-template-columns:90px minmax(0,1fr) 64px;gap:10px;align-items:center;font-size:13px}
.hb .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb .track{height:12px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.hb .track i{display:block;height:100%;border-radius:0 4px 4px 0}
.hb .v{text-align:right}
.about{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:18px;align-items:center}
@media (max-width:860px){.about{grid-template-columns:minmax(0,1fr)}}
.costs{display:grid;gap:10px}
.costs div{background:var(--surface-2);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.costs b{font-size:22px;font-weight:800}
.costs span{font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.card,.stat{transition:border-color .15s}}

/* ---------------- matchmaking ---------------- */
function buildSchedule(){
  const out={generatedAt:new Date().toISOString(),weeks:{},notes:[],waitlist:{frat:[],sorority:[]},pulledIn:[]};
  PLAY.forEach(w=>out.weeks[w.id]={frat:[],sorority:[]});
  for(const side of ['frat','sorority']){
    const f=field(side); let entrants=[...f.in]; const wait=[...f.wait];
    if(entrants.length%2===1&&wait.length){const p=wait.shift();entrants.push(p);out.pulledIn.push(p.orgId);out.notes.push(`${org(p.orgId).short} moved up from the waitlist so every ${SIDES[side].one.toLowerCase()} has an opponent.`)}
    out.waitlist[side]=wait.map(s=>s.orgId);
    const ids=new Set(entrants.map(s=>s.orgId)); const by=Object.fromEntries(entrants.map(s=>[s.orgId,s]));
    const paired=new Set(); const pairs=[];
    // 1. picked each other
    for(const s of entrants){const r=s.rival; if(!r||paired.has(s.orgId)||paired.has(r)||!ids.has(r)) continue; if(by[r].rival===s.orgId){pairs.push({a:s.orgId,b:r,reason:'Picked each other'});paired.add(s.orgId);paired.add(r)}}
    // 2. one-sided picks, in sign-up order
    for(const s of entrants){const r=s.rival; if(!r||paired.has(s.orgId)||paired.has(r)||!ids.has(r)) continue; pairs.push({a:s.orgId,b:r,reason:`${org(s.orgId).short} picked ${org(r).short}`});paired.add(s.orgId);paired.add(r)}
    // 3. closest size
    const rest=entrants.filter(s=>!paired.has(s.orgId)).sort((x,y)=>org(y.orgId).members-org(x.orgId).members);
    for(let i=0;i+1<rest.length;i+=2){const a=rest[i].orgId,b=rest[i+1].orgId;pairs.push({a,b,reason:`Closest in size (${org(a).members} vs ${org(b).members} members)`})}
    if(rest.length%2===1){const lone=rest[rest.length-1].orgId;out.notes.push(`${org(lone).name} has no opponent yet. Invite the next-largest chapter or pair them by hand.`)}
    // weeks: fewest shared options first
    const prefs=id=>(by[id].weeks&&by[id].weeks.length?by[id].weeks:PLAY.map(w=>w.id)).filter(w=>PLAY.some(p=>p.id===w));
    const withOpts=pairs.map(p=>{const A=prefs(p.a),B=prefs(p.b);let both=A.filter(w=>B.includes(w));let fit='Both chapters picked this week';if(!both.length){both=[...new Set([...A,...B])];fit='One chapter picked this week'}return{...p,opts:both,fit}}).sort((x,y)=>x.opts.length-y.opts.length);
    for(const p of withOpts){
      let wk=p.opts.find(w=>out.weeks[w][side].length<PER_WEEK);
      let fit=p.fit;
      if(!wk){wk=PLAY.map(w=>w.id).find(w=>out.weeks[w][side].length<PER_WEEK);fit='Neither preferred week had room'}
      if(!wk){out.notes.push(`No room left for ${org(p.a).short} vs ${org(p.b).short}.`);continue}
      out.weeks[wk][side].push({a:p.a,b:p.b,reason:p.reason,fit});
    }
  }
  return out;
}
function scheduledTeams(){
  const list=[]; if(!S.schedule) return list;
  for(const w of PLAY){const wk=S.schedule.weeks&&S.schedule.weeks[w.id]; if(!wk) continue;
    for(const side of ['frat','sorority']) for(const m of (wk[side]||[])){list.push({id:m.a,opp:m.b,week:w.id,side});list.push({id:m.b,opp:m.a,week:w.id,side})}}

/* ---------------- Square report parsing + scoring ---------------- */
function parseCSV(text){
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true; else if(c===','){row.push(f);f=''} else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=''} else f+=c}
  if(f!==''||row.length){row.push(f);rows.push(row)}
  return rows.filter(r=>r.some(x=>String(x).trim()!==''));
}
const toNum=v=>{if(v==null)return 0;let s=String(v).trim();if(!s)return 0;const neg=/^\(.*\)$/.test(s)||/^-/.test(s.replace(/[$\s]/g,''));s=s.replace(/[^0-9.]/g,'');const n=parseFloat(s)||0;return neg?-n:n};
function scoreReport(text,weekId){
  const rows=parseCSV(text.replace(/^﻿/,''));
  const hi=rows.findIndex(r=>r.some(c=>/^item$/i.test(String(c).trim())));
  if(hi<0) throw new Error('This file has no "Item" column. In Square, export the Items Detail CSV (Transactions, then Export, then Items Detail).');
  const head=rows[hi].map(c=>String(c).trim().toLowerCase());
  const col=(...names)=>{for(const n of names){const i=head.findIndex(x=>x===n);if(i>=0)return i}for(const n of names){const i=head.findIndex(x=>x.includes(n));if(i>=0)return i}return -1};
  const ci={item:col('item'),qty:col('qty','quantity'),net:col('net sales'),gross:col('gross sales'),txn:col('transaction id','payment id','order id'),date:col('date')};
  if(ci.net<0&&ci.gross<0) throw new Error('This file has no "Net Sales" or "Gross Sales" column. Export the Items Detail CSV from Square.');
  const teamIds=teamsInWeek(weekId); if(!teamIds.length) throw new Error('No matchups are set for this week yet. Generate matchups first.');
  const keys=teamIds.map(id=>{const o=org(id),s=S.subs[id]||{};return{id,sundae:norm(s.sundaeName),tags:[norm(o.name),norm(o.short)].filter(Boolean)}});
  const findSundae=item=>{let best=null;for(const k of keys){if(k.sundae&&item.includes(k.sundae)&&(!best||k.sundae.length>best.sundae.length))best=k}return best};
  const findTag=item=>{if(!item.includes('here for'))return null;const rest=item.slice(item.indexOf('here for')+8).trim();let best=null,bl=0;for(const k of keys)for(const t of k.tags){if((rest===t||rest.startsWith(t+' ')||rest.endsWith(' '+t)||rest.includes(t))&&t.length>bl){best=k;bl=t.length}}return best||{id:null}};
  const txns=new Map(); let dataRows=0;
  rows.slice(hi+1).forEach((r,idx)=>{
    const item=norm(r[ci.item]); if(!item) return; dataRows++;
    const amt=toNum(ci.net>=0?r[ci.net]:r[ci.gross]); const qty=ci.qty>=0?(toNum(r[ci.qty])||1):1;
    const tid=(ci.txn>=0&&String(r[ci.txn]).trim())||('row'+idx);
    if(!txns.has(tid)) txns.set(tid,{lines:[]});
    const tag=findTag(item); const sun=tag?null:findSundae(item);
    txns.get(tid).lines.push({amt,qty,tag:tag?tag.id||'?':null,sundae:sun?sun.id:null});
  });
  const T=Object.fromEntries(teamIds.map(id=>[id,{raised:0,sundaeQty:0,sundaeSales:0,otherSales:0,orders:0,tagOrders:0}]));
  let showdownOrders=0, unknownTags=0;
  for(const [,t] of txns){
    const tagTeams=[...new Set(t.lines.filter(l=>l.tag&&l.tag!=='?').map(l=>l.tag))];
    unknownTags+=t.lines.filter(l=>l.tag==='?').length;
    const sunTeams=[...new Set(t.lines.filter(l=>l.sundae).map(l=>l.sundae))];
    const teams=[...new Set([...tagTeams,...sunTeams])]; if(!teams.length) continue;
    showdownOrders++;
    const other=t.lines.filter(l=>!l.sundae&&!l.tag).reduce((a,l)=>a+l.amt,0);
    for(const l of t.lines) if(l.sundae){T[l.sundae].sundaeQty+=l.qty;T[l.sundae].sundaeSales+=l.amt;T[l.sundae].raised+=l.amt}
    const otherTo=tagTeams.length===1?tagTeams:teams;
    for(const id of otherTo){T[id].otherSales+=other/otherTo.length;T[id].raised+=other/otherTo.length}
    for(const id of teams){T[id].orders++; if(tagTeams.includes(id)&&!sunTeams.includes(id)) T[id].tagOrders++}
  }
  for(const id in T) for(const k in T[id]) T[id][k]=Math.round(T[id][k]*100)/100;
  return {teams:T,rows:dataRows,orders:txns.size,showdownOrders,unknownTags};
}
/* Head to head = sundaes sold. Winner takes pct% of BOTH sundaes' sales.
   Every chapter, win or lose, earns pct% of its own other ("Here for") sales. */
const ZERO={raised:0,sundaeQty:0,sundaeSales:0,otherSales:0,orders:0,tagOrders:0};
function outcome(weekId,m){
  const R=S.results[weekId]; if(!R||!R.teams) return null;
  const A={...ZERO,...(R.teams[m.a]||{})},B={...ZERO,...(R.teams[m.b]||{})};
  let win=null; if(A.sundaeQty!==B.sundaeQty) win=A.sundaeQty>B.sundaeQty?m.a:m.b; else if(A.sundaeSales!==B.sundaeSales) win=A.sundaeSales>B.sundaeSales?m.a:m.b;
  const p=S.settings.pct/100, sundaePot=A.sundaeSales+B.sundaeSales, prize=sundaePot*p;
  const payA=(win===m.a?prize:0)+A.otherSales*p, payB=(win===m.b?prize:0)+B.otherSales*p;
  return {A,B,win,sundaePot,prize,payA,payB,pot:A.raised+B.raised};
}
function standings(){
  const rows=scheduledTeams().map(t=>{const R=S.results[t.week];const st=R&&R.teams&&R.teams[t.id];const oc=st?outcome(t.week,{a:t.id,b:t.opp}):null;

  rows.sort((a,b)=>(b.sundaeQty??-1)-(a.sundaeQty??-1)||(b.raised??-1)-(a.raised??-1)||org(b.id).members-org(a.id).members);
  return rows;
}

  const txn=(items)=>{tn++;const id='DEMO'+weekId.toUpperCase()+String(tn).padStart(5,'0');let d=baseDay+Math.floor(r()*7);let mo=month;if(mo===3&&d>31){d-=31;mo=4}

    for(const [cat,name,p,q] of items){const qty=q||1;const amt=(p*qty).toFixed(2);lines.push([date,time,'Eastern Time (US & Canada)',cat,name,qty,'Regular','','',`$${amt}`,'$0.00',`$${amt}`,`$${(p*qty*0.0725).toFixed(2)}`,id,id,r()<.55?'Drive-Thru iPad':'Window iPad','','','Payment','Spring Street Treats',r()<.55?'Drive-Thru':'Walk-Up'])}};
  for(const id of ids){
    const o=org(id),s=S.subs[id]||{}; const item=`${s.sundaeName||'Showdown Sundae'} (${o.short})`;
    const strength=(0.7+r()*0.6)*(weekId==='finals'?1.3:1);
    const nS=Math.round(o.members*0.42*strength+r()*10), nT=Math.round(o.members*0.24*strength+r()*8);
    for(let i=0;i<nS;i++){const extra=r()<.35?[pick(r,menu)]:[];txn([['Showdown',item,price,r()<.15?2:1],...extra])}
    for(let i=0;i<nT;i++){const it=pick(r,menu);txn([[it[0],it[1],it[2]],...(r()<.3?[pick(r,menu)]:[]),['Showdown',`Here for ${o.short}`,0]])}
  }
  const nO=140+Math.floor(r()*80); for(let i=0;i<nO;i++){txn([pick(r,menu),...(r()<.25?[pick(r,menu)]:[])])}
  return lines.map(row=>row.map(c=>{const v=String(c);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(',')).join('\n');
}

async function saveSettings(patch,msg){
  if(!needEdit()||!S.db) return false;
  const next={...S.settings,...patch};
  try{await S.db.doc('config/settings').set(JSON.parse(JSON.stringify(next)));S.settings=next;if(msg)toast(msg);return true}
  catch(e){toast('Could not save: '+(e.message||e.code));return false}
}
async function scoreAndSave(weekId,text,fileName,demo){
  if(!needEdit()||!S.db) return;
  let res; try{res=scoreReport(text,weekId)}catch(e){toast(e.message,6000);return}
  const doc={weekId,fileName,demo:!!demo,scoredAt:new Date().toISOString(),...res};
  try{await S.db.doc('results/'+weekId).set(doc);toast(`${WEEKS.find(w=>w.id===weekId).label} scored: ${res.rows} lines read, ${res.showdownOrders} Showdown orders found.`)}
  catch(e){toast('Could not save results: '+(e.message||e.code))}
}

function niceMax(v){if(v<=0)return 100;const p=Math.pow(10,Math.floor(Math.log10(v)));const n=v/p;return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p}
function barChart(data){
  const W=640,H=250,L=60,R=10,T=12,B=30,iw=W-L-R,ih=H-T-B;
  const max=niceMax(Math.max(1,...data.flatMap(d=>[d.frat,d.sorority])));
  const gw=iw/Math.max(data.length,1), bw=Math.min(36,gw*0.32), y=v=>T+ih-(v/max)*ih;
  let grid='';for(let i=0;i<=4;i++){const v=max*i/4,yy=y(v).toFixed(1);grid+=`<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="var(--line)" stroke-width="1"/><text x="${L-8}" y="${(+yy+4).toFixed(1)}" text-anchor="end" font-size="11" fill="var(--muted)">${money0(v)}</text>`}
  const bar=(x,v,col,tip)=>{const yy=y(v),hh=T+ih-yy;if(hh<0.5)return '';const r=Math.min(4,hh,bw/2);return `<path d="M${x.toFixed(1)} ${T+ih} V${(yy+r).toFixed(1)} Q${x.toFixed(1)} ${yy.toFixed(1)} ${(x+r).toFixed(1)} ${yy.toFixed(1)} H${(x+bw-r).toFixed(1)} Q${(x+bw).toFixed(1)} ${yy.toFixed(1)} ${(x+bw).toFixed(1)} ${(yy+r).toFixed(1)} V${T+ih} Z" fill="var(${col})" data-tip="${h(tip)}"/>`};
  let bars='',labels='';
  data.forEach((d,i)=>{const cx=L+gw*i+gw/2;bars+=bar(cx-bw-1,d.frat,'--c-frat',`${d.label} · Fraternities: ${money(d.frat)} (${d.frQ} sundaes)`)+bar(cx+1,d.sorority,'--c-soro',`${d.label} · Sororities: ${money(d.sorority)} (${d.soQ} sundaes)`);labels+=`<text x="${cx.toFixed(1)}" y="${H-9}" text-anchor="middle" font-size="12" fill="var(--muted)">${h(d.label)}</text>`});
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Money raised by week for fraternities and sororities">${grid}<line x1="${L}" x2="${W-R}" y1="${T+ih}" y2="${T+ih}" stroke="var(--muted)" stroke-width="1"/>${bars}${labels}</svg>`;
}
function moneyChart(){

      <div class="split" role="img" aria-label="Share of money raised"><i style="width:${(fr/tot*100).toFixed(1)}%;background:var(--c-frat)" data-tip="Fraternities: ${(fr/tot*100).toFixed(0)}%"></i><i style="width:${(so/tot*100).toFixed(1)}%;background:var(--c-soro)" data-tip="Sororities: ${(so/tot*100).toFixed(0)}%"></i></div>
      <div class="row small muted" style="justify-content:space-between"><span>Fraternities ${(fr/tot*100).toFixed(0)}%</span><span>Total ${money(tot)}</span><span>Sororities ${(so/tot*100).toFixed(0)}%</span></div>`;

  </div></div></section>
  <section class="card stack"><h2>Sundae photos</h2><p class="small muted" style="margin:0">The first time staff make a chapter's sundae, snap a photo and add it here. It replaces the sketch on the board.</p>
    <div class="grid3">${ids.map(id=>`<div class="row" style="flex-wrap:nowrap"><div class="sub-art" style="width:56px;height:56px;flex:none">${artFor(id,S.subs[id],56)}</div><div style="min-width:0"><b class="small">${h(org(id).short)} · ${h((S.subs[id]||{}).sundaeName||'')}</b><div><label class="btn small" for="ph-${id}">${S.photos[id]?'Replace photo':'Add photo'}</label><input type="file" id="ph-${id}" data-photo="${id}" accept="image/*" hidden></div></div></div>`).join('')}</div></section>`;
}

/* ---------------- render ---------------- */
function snapshotInputs(){const vals={};document.querySelectorAll('#main input[id],#main select[id],#main textarea[id]').forEach(el=>{if(el.type==='file')return;vals[el.id]=(el.type==='checkbox'||el.type==='radio')?{c:el.checked}:{v:el.value}});const a=document.activeElement;return{vals,focus:a&&a.id?{id:a.id,s:a.selectionStart,e:a.selectionEnd}:null}}
function restoreInputs(snap){for(const id in snap.vals){const el=document.getElementById(id);if(!el)continue;const x=snap.vals[id];if('c' in x)el.checked=x.c;else if(el.tagName!=='SELECT'||[...el.options].some(o=>o.value===x.v))el.value=x.v}
  if(snap.focus){const el=document.getElementById(snap.focus.id);if(el){el.focus({preventScroll:true});try{if(snap.focus.s!=null)el.setSelectionRange(snap.focus.s,snap.focus.e)}catch(e){}}}}
let lastRoute=null;
function render(){
  const route=(location.hash||'').slice(1)||'overview'; S.route=ROUTES.some(r=>r[0]===route)?route:'overview';
  renderNav();
  const same=lastRoute===S.route; const snap=same?snapshotInputs():null;
  const v={overview:vOverview,outreach:vOutreach,signup:vSignup,signups:vSignups,matchups:vMatchups,scoreboard:vScoreboard,'menu-board':vMenuBoard}[S.route];
  $('#main').innerHTML=v();
  if(snap) restoreInputs(snap);
  if(!same) window.scrollTo(0,0);
  lastRoute=S.route;
  wire();
}
let rT=null; function schedule(){clearTimeout(rT);rT=setTimeout(render,30)}

/* ---------------- interactions ---------------- */
function updateSignupBits(){
  const f=$('#signup-form'); if(!f) return;
  const orgId=$('#f-org').value; const o=S.orgs[orgId];
  const rs=$('#f-rival'); const cur=rs.value;
  rs.innerHTML='<option value="">No preference, match us by size</option>'+(o?orgList(o.side).filter(x=>x.id!==orgId).map(x=>`<option value="${x.id}">${h(x.name)} (${x.members})</option>`).join(''):'');
  if([...rs.options].some(op=>op.value===cur)) rs.value=cur;
  const sub=collectSundae();
  $('#sundae-prev').innerHTML=`${sundaeSVG(sub,160)}<div class="nm">${h(sub.sundaeName||'Your sundae')}</div><div class="small muted" style="text-align:center">${h([...sub.bases,sub.vessel,...sub.toppings,...sub.sauces].filter(Boolean).join(' · ')||'Pick a flavor to start')}</div>`;
}
function collectSundae(){
  const vals=n=>[...document.querySelectorAll(`input[name="${n}"]:checked`)].map(x=>x.value);
  return {bases:vals('f-base'),vessel:vals('f-vessel')[0]||'',toppings:vals('f-top'),sauces:vals('f-sauce'),sundaeName:($('#f-sname')||{}).value||''};
}
async function submitSignup(e){
  e.preventDefault(); const msg=$('#form-msg'); const say=t=>{msg.textContent=t;msg.style.color='var(--bad)'};
  if(!S.db){say('Sign-ups need the season database. Open this page in claude.ai while signed in.');return}
  const orgId=$('#f-org').value, name=$('#f-name').value.trim(), email=$('#f-email').value.trim();
  const sun=collectSundae(); const weeks=[...document.querySelectorAll('input[name="f-week"]:checked')].map(x=>x.value);
  if(!orgId) return say('Choose your chapter.'); if(!name) return say('Add your name.'); if(!/^\S+@\S+\.\S+$/.test(email)) return say('Add an email we can reach you at.');
  if(!weeks.length) return say('Pick at least one week.'); if(!sun.bases.length) return say('Pick a soft serve flavor.'); if(!sun.vessel) return say('Pick a cup or cone.');
  if(!sun.sundaeName.trim()) return say('Give your sundae a name.');
  const btn=$('#f-submit'); btn.disabled=true; msg.style.color='var(--muted)'; msg.textContent='Saving...';
  let sketchId='',sketchUrl='';
  if(S.ui.sketchFile){ if(S.assets){try{const up=await S.assets.upload(S.ui.sketchFile);sketchId=up.id;sketchUrl=up.url}catch(err){msg.textContent='The sketch could not upload ('+(err.code||'error')+'). Saving the rest.'}} }
  const prev=S.subs[orgId];
  const doc={orgId,contactName:name,contactRole:$('#f-role').value.trim(),contactEmail:email,contactPhone:$('#f-phone').value.trim(),rival:$('#f-rival').value,weeks,...sun,sundaeName:sun.sundaeName.trim(),description:$('#f-desc').value.trim(),
    sketchId:sketchId||(prev&&prev.sketchId)||'',sketchUrl:sketchUrl||(prev&&prev.sketchUrl)||'',submittedAt:(prev&&prev.submittedAt)||new Date().toISOString(),updatedAt:new Date().toISOString(),demo:false};
  try{await S.db.doc('submissions/'+orgId).set(doc);S.subs[orgId]=doc;S.ui.signupDone={orgId,sub:doc};S.ui.sketchFile=null;S.ui.sketchUrl=null;render()}
  catch(err){btn.disabled=false;say(err.code==='not_granted'?'You need edit or contributor access to this page to sign up.':'Could not save: '+(err.message||err.code))}
}
function wire(){
  const r=S.route;
  if(r==='outreach'&&$('#tpl-subj')){
    const upd=()=>{const o=org(S.ui.previewOrg);const v={...o,presFirst:maskWord(o.presFirst)};
      $('#prev-email').innerHTML=`<span class="subj">${h(merge($('#tpl-subj').value,v))}</span>${h(merge($('#tpl-body').value,v))}`;$('#prev-dm').textContent=merge($('#tpl-dm').value,v);
      $('#prev-to').textContent=`To: ${presName(o)} <${maskEmail(o.presEmail)}>`;$('#prev-dm-to').textContent='Instagram DM to '+(o.ig||'(none)')};
    ['#tpl-subj','#tpl-body','#tpl-dm'].forEach(s=>$(s).addEventListener('input',upd)); upd();
    $('#prev-org').onchange=e=>{S.ui.previewOrg=e.target.value;upd()};
    $('#tpl-save').onclick=()=>saveSettings({emailSubject:$('#tpl-subj').value,emailBody:$('#tpl-body').value,dmBody:$('#tpl-dm').value},'Templates saved.');
    $('#tpl-reset').onclick=()=>{$('#tpl-subj').value=DEFAULTS.emailSubject;$('#tpl-body').value=DEFAULTS.emailBody;$('#tpl-dm').value=DEFAULTS.dmBody;upd();toast('Default wording restored. Save to keep it.')};
    document.querySelectorAll('[data-sel]').forEach(cb=>cb.onchange=()=>{S.ui.selected[cb.dataset.sel]=cb.checked;schedule()});
    $('#sel-all').onclick=()=>{orgList().forEach(o=>S.ui.selected[o.id]=true);render()};
    $('#sel-none').onclick=()=>{orgList().forEach(o=>S.ui.selected[o.id]=false);render()};
    $('#send-email').onclick=e=>{if(!needEdit())return;const ids=orgList().filter(o=>S.ui.selected[o.id]!==false).map(o=>o.id);
      armConfirm(e.currentTarget,`Confirm: email ${ids.length} chapters`,async()=>{const now=new Date().toISOString();let n=0;for(const id of ids){try{await S.db.doc('outreach/'+id).set({...(S.outreach[id]||{}),emailedAt:now,demo:true});n++}catch(err){toast('Could not log the send: '+(err.message||err.code));return}}
        toast(SITE?`${n} personalized emails sent from ${SENDER}.`:`${n} personalized emails written and logged (demo mode). The live version sends them from SST's Gmail.`,5200)})};
    document.querySelectorAll('[data-dm]').forEach(a=>a.addEventListener('click',ev=>{const o=org(a.dataset.dm);if(FILM){ev.preventDefault();setTimeout(()=>{location.href=a.href},1800)}const text=merge($('#tpl-dm').value,o);
      S.ui.previewOrg=o.id; $('#prev-org').value=o.id; upd();
      try{const p=navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(text):Promise.reject();p.then(()=>toast(SITE?`DM for ${o.short} copied. Opening their Instagram…`:`DM for ${o.short} copied. Paste it into the chat that just opened.`)).catch(()=>{selectText($('#prev-dm'));toast('Copy is blocked in this view, so the DM is selected in the preview. Press Cmd+C, then paste it in the chat.',5200)})}catch(err){}
      if(S.canEdit&&S.db) S.db.doc('outreach/'+o.id).set({...(S.outreach[o.id]||{}),dmAt:new Date().toISOString(),demo:true}).catch(()=>{});
    }));
  }
  if(r==='signup'){
    if(S.ui.signupDone){$('#signup-again').onclick=()=>{S.ui.signupDone=null;render()};return}
    const f=$('#signup-form'); f.addEventListener('change',updateSignupBits); f.addEventListener('input',e=>{if(e.target.id==='f-sname')updateSignupBits()});
    f.querySelectorAll('[data-max]').forEach(g=>g.addEventListener('change',e=>{const max=+g.dataset.max;if(g.querySelectorAll('input:checked').length>max){e.target.checked=false;toast(`Pick up to ${max}.`);updateSignupBits()}}));
    $('#f-sketch').onchange=e=>{const file=e.target.files[0];if(!file)return;if(file.size>15*1024*1024){toast('That image is over 15 MB. Try a smaller photo.');return}S.ui.sketchFile=file;try{if(S.ui.sketchUrl)URL.revokeObjectURL(S.ui.sketchUrl)}catch(x){}S.ui.sketchUrl=URL.createObjectURL(file);$('#sketch-thumb').innerHTML=`<img src="${S.ui.sketchUrl}" alt="Your sketch">`};
    f.addEventListener('submit',submitSignup); updateSignupBits();
  }
  if(r==='signups'){
    const a=$('#demo-add'); if(a) a.onclick=addDemoSignups;
    const c=$('#demo-clear'); if(c) c.onclick=e=>{if(!needEdit())return;armConfirm(e.currentTarget,'Confirm: remove demo sign-ups',async()=>{for(const s of Object.values(S.subs).filter(s=>s.demo)){try{await S.db.doc('submissions/'+s.orgId).delete()}catch(err){}}toast('Demo sign-ups removed.')})};
    if($('#reset-demo')) $('#reset-demo').onclick=e=>{if(!needEdit())return;armConfirm(e.currentTarget,'Confirm: reset demo season',async()=>{
      const jobs=[...Object.values(S.subs).filter(s=>s.demo).map(s=>'submissions/'+s.orgId),'season/schedule',...Object.keys(S.results).map(k=>'results/'+k),...Object.keys(S.outreach).map(k=>'outreach/'+k),...Object.keys(S.photos).map(k=>'photos/'+k)];
      for(const p of jobs){try{await S.db.doc(p).delete()}catch(err){}}toast('Demo season reset. Real sign-ups stay.')})};
  }
  if(r==='matchups'){
    const g=$('#gen'); if(g) g.onclick=async()=>{if(!needEdit())return;try{await S.db.doc('season/schedule').set(buildSchedule());toast('Matchups generated.')}catch(err){toast('Could not save: '+(err.message||err.code))}};
    const rg=$('#regen'); if(rg) rg.onclick=e=>{if(!needEdit())return;armConfirm(e.currentTarget,Object.keys(S.results).length?'Confirm: results stay, pairs may change':'Confirm: regenerate',async()=>{try{await S.db.doc('season/schedule').set(buildSchedule());toast('Matchups regenerated.')}catch(err){toast('Could not save: '+(err.message||err.code))}})};
    const em=$('#email-matchups'); if(em) em.onclick=()=>{if(!needEdit())return;toast(`${scheduledTeams().length} matchup emails written (demo mode): each chapter gets its rival, its week and its sundae as SST will build it.`,5200)};
  }
  if(r==='scoreboard'){
    document.querySelectorAll('[data-pct]').forEach(b=>b.onclick=()=>saveSettings({pct:+b.dataset.pct},`Payout set to ${b.dataset.pct}%.`));
    document.querySelectorAll('[data-rule]').forEach(b=>b.onclick=()=>saveSettings({finalistRule:b.dataset.rule},b.dataset.rule==='anyone'?'Finalists: top 3 by sundaes sold, win or lose.':'Finalists: top 3 weekly winners by sundaes sold.'));
    document.querySelectorAll('[data-lb]').forEach(b=>b.onclick=()=>{S.ui.lbFilter=b.dataset.lb;render()});
    document.querySelectorAll('[data-chart]').forEach(b=>b.onclick=()=>{S.ui.chart=b.dataset.chart;render()});
    document.querySelectorAll('[data-up]').forEach(inp=>inp.onchange=async()=>{const file=inp.files[0];if(!file)return;const text=await file.text();scoreAndSave(inp.dataset.up,text,file.name,false)});
    document.querySelectorAll('[data-demo]').forEach(b=>b.onclick=()=>{const id=b.dataset.demo;scoreAndSave(id,demoReportCSV(id),`square-items-detail-${id}-demo.csv`,true)});
    document.querySelectorAll('[data-clear]').forEach(b=>b.onclick=e=>{if(!needEdit())return;armConfirm(e.currentTarget,'Confirm: clear',async()=>{try{await S.db.doc('results/'+b.dataset.clear).delete();toast('Week cleared.')}catch(err){toast('Could not clear: '+(err.message||err.code))}})});
  }
  if(r==='menu-board'){
    const pw=$('#poster-week'); if(pw) pw.onchange=()=>{S.ui.posterWeek=pw.value;render()};
    document.querySelectorAll('[data-photo]').forEach(inp=>inp.onchange=async()=>{if(!needEdit())return;const file=inp.files[0];if(!file)return;if(!S.assets){toast('Photo uploads are not available in this view.');return}
      try{const up=await S.assets.upload(file);await S.db.doc('photos/'+inp.dataset.photo).set({assetId:up.id,url:up.url,addedAt:new Date().toISOString()});toast('Photo added to the board.')}catch(err){toast('Could not upload: '+(err.message||err.code))}});
    const sv=$('#poster-save'); if(sv) sv.onclick=async()=>{
      if(!window.html2canvas){toast('The image tool did not load. Take a screenshot of the board instead.');return}
      if(!S.downloads){toast('Saving files is not available in this view. Take a screenshot of the board instead.');return}
      sv.disabled=true;sv.textContent='Rendering...';
      try{const canvas=await html2canvas($('#poster'),{scale:2,backgroundColor:null,useCORS:true});const blob=await new Promise(res=>canvas.toBlob(res,'image/png'));
        await S.downloads.save({filename:`showdown-${S.ui.posterWeek}-menu-board.png`,data:blob});toast('Menu board saved.')}
      catch(err){toast(err&&err.code==='declined'?'Save cancelled.':'Could not save the image: '+((err&&(err.message||err.code))||'unknown error'))}
      finally{sv.disabled=false;sv.textContent='Save as image'}};
  }
}
function selectText(el){try{const rg=document.createRange();rg.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(rg)}catch(e){}}
/* hover tooltips for chart marks */
(function(){const tip=document.createElement('div');tip.className='tip';tip.hidden=true;document.body.appendChild(tip);
  document.addEventListener('mousemove',e=>{const t=e.target.closest&&e.target.closest('[data-tip]');if(!t){tip.hidden=true;return}tip.textContent=t.getAttribute('data-tip');tip.hidden=false;
    const x=Math.min(e.clientX+14,innerWidth-tip.offsetWidth-8),y=Math.max(8,e.clientY-tip.offsetHeight-12);tip.style.left=x+'px';tip.style.top=y+'px'});
  document.addEventListener('mouseleave',()=>tip.hidden=true);})();

/* ---------------- boot ---------------- */
window.addEventListener('hashchange',render);
render();
(async()=>{
  const timer=setTimeout(()=>{S.timedOut=true;schedule()},10000);
  let db=null,user=null;
  if(!window.claude||typeof window.claude.use!=='function'){S.conn='no runtime';S.timedOut=true;clearTimeout(timer);schedule();return}
  window.claude.use('user').then(u=>{S.user=u;S.canEdit=u?!!u.canEdit():false;schedule()}).catch(()=>{});
  try{db=await window.claude.use('db')}catch(e){S.conn='db error: '+(e&&(e.code||e.message)||'unknown')}
  if(!db){if(S.conn==='connecting')S.conn='db unavailable';S.timedOut=true;clearTimeout(timer);schedule();return}
  S.conn='ok';
  S.db=db;
  window.claude.use('assets').then(a=>{S.assets=a}).catch(()=>{});
  window.claude.use('downloads').then(d=>{S.downloads=d}).catch(()=>{});
  const fail=e=>{console.warn(e);S.conn='read error: '+((e&&e.code)||'unknown');schedule()};
  db.collection('orgs').onSnapshot(snap=>{clearTimeout(timer);S.orgs=Object.fromEntries(snap.docs.map(d=>[d.id,{id:d.id,...d.data()}]));S.loaded.orgs=true;schedule()},fail);
  db.doc('config/settings').onSnapshot(snap=>{const d=snap.exists?snap.data():{};S.settings={...structuredClone(DEFAULTS),...d,limits:{...DEFAULTS.limits,...(d.limits||{})}};schedule()},fail);
  db.collection('outreach').onSnapshot(snap=>{S.outreach=Object.fromEntries(snap.docs.map(d=>[d.id,d.data()]));schedule()},fail);
  db.collection('submissions').onSnapshot(snap=>{S.subs=Object.fromEntries(snap.docs.map(d=>[d.id,d.data()]));schedule()},fail);
  db.doc('season/schedule').onSnapshot(snap=>{S.schedule=snap.exists?snap.data():null;schedule()},fail);
  db.collection('results').onSnapshot(snap=>{S.results=Object.fromEntries(snap.docs.map(d=>[d.id,d.data()]));schedule()},fail);
  db.collection('photos').onSnapshot(snap=>{S.photos=Object.fromEntries(snap.docs.map(d=>[d.id,d.data()]));schedule()},fail);
})();
</script>
